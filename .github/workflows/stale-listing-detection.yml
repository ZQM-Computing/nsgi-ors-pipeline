name: Stale Listing Detection
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'authoritative/*.md'
      - 'scripts/stale_listing_detector.py'

jobs:
  detect-stale-listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run stale listing detection
        id: detect
        run: |
          python scripts/stale_listing_detector.py \
            --enum authoritative/NSGI_ORS_Master_Enumeration_2026-08-07.md \
            --verification authoritative/NSGI_ORS_Verification_Pass_2026-08-07.md \
            --output stale_listings_report.json
          echo "report_created=true" >> $GITHUB_OUTPUT

      - name: Check for stale listings
        id: check
        run: |
          if [ -f stale_listings_report.json ]; then
            COUNT=$(python -c "import json; d=json.load(open('stale_listings_report.json')); print(len(d.get('stale_listings', [])))")
            echo "stale_count=$COUNT" >> $GITHUB_OUTPUT
            if [ "$COUNT" -gt 0 ]; then
              echo "needs_review=true" >> $GITHUB_OUTPUT
              echo "WARNING: $COUNT stale listing(s) detected"
              cat stale_listings_report.json
            else
              echo "needs_review=false" >> $GITHUB_OUTPUT
              echo "OK: No stale listings detected"
            fi
          else
            echo "No report generated"
            echo "stale_count=0" >> $GITHUB_OUTPUT
            echo "needs_review=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for stale listings
        if: ${{ github.event_name == 'schedule' && needs.check.outputs.needs_review == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('stale_listings_report.json', 'utf8'));
            const stale = report.stale_listings || [];

            const body = [
              '# Automated Stale Listing Detection Report',
              '',
              '## Summary',
              `Detected **${stale.length}** potentially stale listing(s) that may need removal review.`,
              '',
              '## Detected Listings',
              ...stale.map((item, idx) => [
                '',
                `### ${idx + 1}. ${item.id} - ${item.title}`,
                `- **Status**: ${item.status}`,
                `- **Last Checked**: ${item.last_checked}`,
                `- **Recommendation**: ${item.recommendation}`
              ].join('\n')),
              '',
              '## Required Actions',
              '1. Verify each listing against live SAM.gov extract',
              '2. Update verification pass with findings',
              '3. Create removal validation issue for confirmed stale listings',
              '4. Submit PR with removal decision referenced in commit message',
              '',
              '## Audit Trail',
              `- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              '- Detected by: stale-listing-detection workflow'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AUTO] Stale Listing Detection - ${stale.length} listing(s) flagged`,
              body: body,
              labels: ['automated', 'stale-listing-detection', 'audit']
            });

            console.log(`Created issue #${issue.data.number}`);

      - name: Upload stale listings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-listings-report
          path: stale_listings_report.json
          retention-days: 30
